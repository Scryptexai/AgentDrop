# ============================================================================
# Camofox browser — persistent, anti-detection Firefox for Hermes Agent
# ============================================================================
#
# WHY THIS FILE LOOKS LIKE IT DOES
# --------------------------------
# camofox-browser does NOT ship a docker-compose.yml. Upstream ships a
# Makefile that runs:
#
#     docker run -d --restart unless-stopped --name camofox-browser \
#       --shm-size=2g -p 9377:9377 camofox-browser:<version>-<arch>
#
# and its README carries an explicit warning:
#
#     "Do not run `docker build` directly. The Dockerfile uses bind mounts to
#      pull pre-downloaded binaries from dist/. Always use `make up`
#      (or `make fetch` then `make build`)."
#
# So this compose file deliberately does NOT contain a `build:` section. It
# references the locally built image. Build it first:
#
#     git clone https://github.com/jo-inc/camofox-browser.git ~/.camofox-src
#     cd ~/.camofox-src && make up        # fetch + build + run
#
# ...or let scripts/start-browser.sh do it. Then `docker compose up -d` here
# will find the image already present.
#
# Image tag format comes from camofox-browser/Makefile:
#     IMAGE := camofox-browser:$(VERSION)-$(ARCH)
#     VERSION ?= 135.0.1 ; ARCH auto-detected (arm64 -> aarch64)
# ============================================================================

name: camofox

services:
  camofox:
    image: camofox-browser:${CAMOFOX_VERSION:-135.0.1}-${CAMOFOX_ARCH:-x86_64}
    container_name: camofox-browser
    restart: unless-stopped

    # Firefox tabs crash without this. Mirrors upstream's --shm-size=2g.
    shm_size: 2gb

    ports:
      # API Camofox — dipakai Hermes lewat CAMOFOX_URL
      - "${CAMOFOX_PORT:-9377}:${CAMOFOX_PORT:-9377}"
      # noVNC — GUI browser yang bisa Anda lihat dan ambil alih lewat web.
      # Buka: http://localhost:6080/vnc.html
      - "${NOVNC_PORT:-6080}:${NOVNC_PORT:-6080}"

    environment:
      # --- server config (names verified against camofox-browser README) ---
      CAMOFOX_PORT: ${CAMOFOX_PORT:-9377}
      CAMOFOX_BIND_HOST: ${CAMOFOX_BIND_HOST:-0.0.0.0}
      # Bearer auth for all routes except /health, cookie-import, /stop.
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-}
      CAMOFOX_ADMIN_KEY: ${CAMOFOX_ADMIN_KEY:-}
      # Persistence — this is what keeps airdrop logins alive across restarts.
      CAMOFOX_PROFILE_DIR: ${CAMOFOX_PROFILE_DIR:-/data/profiles}
      CAMOFOX_COOKIES_DIR: ${CAMOFOX_COOKIES_DIR:-/data/cookies}
      CAMOFOX_TRACES_DIR: ${CAMOFOX_TRACES_DIR:-/data/traces}
      # Session lifecycle. Default session timeout is 30min; airdrop dashboards
      # are opened in short bursts, so keep the default and raise idle only if
      # you watch the browser live.
      SESSION_TIMEOUT_MS: ${SESSION_TIMEOUT_MS:-1800000}
      BROWSER_IDLE_TIMEOUT_MS: ${BROWSER_IDLE_TIMEOUT_MS:-300000}
      MAX_SESSIONS: ${MAX_SESSIONS:-50}

      # ------------------------------------------------------------------
      # GUI BROWSER (bukan headless) — plugin vnc camofox-browser
      # ------------------------------------------------------------------
      # Rantai yang dibuat plugin vnc (dari plugins/vnc/README.md):
      #
      #   Camoufox (Xvfb :99, 1920x1080)
      #       ^
      #   x11vnc (attach ke :99, port 5900)
      #       ^
      #   noVNC / websockify (port 6080)
      #       ^
      #   Browser Anda -> http://localhost:6080/vnc.html
      #
      # Ini GUI sungguhan: Camoufox berjalan di X server virtual beresolusi
      # manusia, bukan di display 1x1 bawaan mode headless. Watcher plugin
      # mendeteksi display Xvfb dan me-re-attach x11vnc saat Camoufox restart.
      #
      # Dependency (x11vnc, novnc, python3-websockify, net-tools, procps) sudah
      # terpasang di image oleh scripts/install-plugin-deps.sh saat build
      # (lihat plugins/vnc/apt.txt) — tidak perlu instal manual.
      # Nyalakan plugin agentdrop-wallet (lihat camofox-plugins/).
      ENABLE_AGENTDROP_WALLET: ${ENABLE_AGENTDROP_WALLET:-1}
      ENABLE_VNC: ${ENABLE_VNC:-1}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      # Sangat disarankan kalau port 6080 terekspos keluar mesin.
      VNC_PASSWORD: ${VNC_PASSWORD:-}

    volumes:
      # Override config plugin. Target path /app/camofox.config.json berasal
      # dari camofox-browser/lib/plugins.js:68 (CONFIG_PATH = ROOT_DIR +
      # 'camofox.config.json') dan Dockerfile (WORKDIR /app, COPY
      # camofox.config.json ./).
      - ./config/camofox/camofox.config.json:/app/camofox.config.json:ro
      # Plugin yang memuat extension wallet. camofox-browser memindai
      # /app/plugins (lib/plugins.js:67 PLUGINS_DIR = ROOT_DIR + 'plugins').
      - ./camofox-plugins/agentdrop-wallet:/app/plugins/agentdrop-wallet:ro
      # Extension-nya sendiri. Harus direktori berisi manifest.json, bukan
      # .xpi — itu syarat confirm_paths() di Camoufox.
      - ./extensions/agentdrop-wallet:/app/extensions/agentdrop-wallet:ro
      - camofox-profiles:/data/profiles
      - camofox-cookies:/data/cookies
      - camofox-traces:/data/traces

    # /health is unauthenticated by design (documented in the ACCESS_KEY note),
    # which makes it safe to probe.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${CAMOFOX_PORT:-9377}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  camofox-profiles:
  camofox-cookies:
  camofox-traces:
