# Machine-readable skill config (Hermes skill registry format)
name: agentdrop-quest-specialist
domain: airdrop-farming
version: 0.1.0
mode: vision-first
workers: [worker-quests]

triggers:
  - "run the {campaign} airdrop"
  - "complete {campaign} quests"
  - "farm {campaign}"

parameters:
  - name: campaign
    type: string
    required: true
    default: loqua
  - name: profile
    type: string
    required: false
    default: execution
  - name: live_url
    type: string
    required: false

execution:
  runner: python3
  entry: agentdrop.worker.quest_worker
  args:
    - --campaign
    - "agentdrop/campaigns/{campaign}.yaml"
    - --profile
    - "{profile}"
  env:
    AGENTDROP_WORKER_CONFIG: "~/.hermes/profiles/workers/{worker}/config.yaml"

computer_use:
  enabled: true
  vision_first: true
  fallback_to_dom: false
  verify_after_action: true
  verify_completion: true
  max_steps: 50
  recovery_attempts: 3
  coordinate_system: absolute
  screenshot_interval: always

security:
  never_store_private_keys: true
  stop_on_captcha: true
  require_manual_approval_for_wallet: true

success:
  task_completion: 1.0
  click_accuracy_min: 0.9
  max_steps: 50
