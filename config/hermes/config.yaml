# ============================================================================
# HERMES AGENT — CONFIG UTAMA (airdrop farming)
# ============================================================================
# Dipasang ke: ~/.hermes/config.yaml
#
# SETIAP KEY DI FILE INI SUDAH DICEK terhadap sumber asli Hermes Agent
# (NousResearch/hermes-agent @ 25 Aug 2026):
#   - cli-config.yaml.example
#   - hermes_cli/config_defaults.py  -> DEFAULT_CONFIG
#
# Yang TIDAK ada di Hermes dan sengaja TIDAK dipakai di sini:
#   x browser.backend = "browser-use"
#                           -> backend bawaan Hermes adalah headless Chromium
#                              lewat `npx agent-browser`, tanpa ekstensi.
#                              AgentDrop attach ke Chrome for Testing sendiri
#                              lewat browser.cdp_url (lihat blok browser).
#   x security.never_store_private_keys / stop_on_captcha / burner_only /
#     require_approval_for_wallet
#                           -> keempat key ini TIDAK ADA. Key `security:` sendiri
#                              ADA, tapi sub-keynya berbeda (lihat blok security
#                              di bawah). Guardrail yang dimaksud prompt asli
#                              diimplementasikan lewat key yang benar-benar ada:
#                              security.redact_secrets, security.website_blocklist,
#                              approvals.cron_mode, approvals.deny + SOUL.md.
#   x system_prompt:        -> bukan key config. Identitas agent = SOUL.md.
#   x cron: {enabled,jobs_dir} -> key cron asli: allow_agent_scheduling,
#                              preflight, model_drift_guard, model, provider.
#   x toolsets: [file_ops]  -> id toolset asli adalah `file`, bukan `file_ops`.
#   x human_delay utk pacing browser -> human_delay hanya untuk pacing respons
#                              di platform messaging ("off"|"natural"|"custom"),
#                              bukan jeda aksi browser. Tidak dipakai di sini.
#
# Aturan Hermes: secret -> .env, sisanya -> config.yaml.
# ============================================================================

# ----------------------------------------------------------------------------
# MODEL
# ----------------------------------------------------------------------------
model:
  # Format WAJIB "provider/model". String di bawah diambil verbatim dari help
  # `hermes chat -m` di hermes_cli/_parser.py. Jalankan `hermes model` untuk
  # melihat slug yang benar-benar tersedia di akun Anda.
  default: "anthropic/claude-sonnet-4"

  # "auto" = deteksi dari kredensial yang ada. Pilihan lain yang valid:
  # openrouter, anthropic, openai-codex, copilot, gemini, nous, nous-api,
  # custom (vLLM/Ollama/LM Studio), deepinfra, nvidia, huggingface, ...
  provider: "auto"

  # Default bawaan Hermes. Ganti kalau pakai provider custom.
  base_url: "https://openrouter.ai/api/v1"

  # context_length = total window (input+output). Biarkan tidak diset agar
  # Hermes auto-detect dari provider. Diset manual HANYA kalau auto-detect
  # salah (mis. server lokal dengan num_ctx sendiri).
  # context_length: 131072

  # max_tokens = cap OUTPUT per respons. Tidak berhubungan dengan panjang
  # history. Biarkan tidak diset untuk memakai ceiling native model.
  # max_tokens: 8192

# ----------------------------------------------------------------------------
# TOOLSETS — id asli dari hermes_cli/tools_config.py
# ----------------------------------------------------------------------------
# Valid: browser, terminal, file, web, memory, skills, todo, vision,
#        computer_use, code_execution, cronjob, delegation, session_search,
#        context_engine, clarify, delegation, image_gen, tts, stt, ...
# Catatan: `hermes-cli` adalah default bawaan Hermes.
toolsets:
  - hermes-cli
  - browser
  - terminal
  - file
  - web
  - memory
  - todo

# ----------------------------------------------------------------------------
# AGENT
# ----------------------------------------------------------------------------
agent:
  # Default Hermes 500. 90 cukup untuk satu sesi farming dan membatasi biaya.
  # Rekomendasi resmi di cli-config.yaml.example: 20-30 focused, 50-100 open.
  max_turns: 90

  # Level valid: none, minimal, low, medium, high, xhigh, max, ultra.
  # (Prompt aslinya menyebut "xhigh" sebagai maksimum — sebenarnya ada juga
  #  `max` dan `ultra`.)
  reasoning_effort: "medium"

# ----------------------------------------------------------------------------
# BROWSER — Chrome for Testing lewat CDP
# ----------------------------------------------------------------------------
# AgentDrop TIDAK memakai browser bawaan Hermes. Jalur default Hermes adalah
# "Local mode: zero-cost headless Chromium via agent-browser"
# (hermes-agent/tools/browser_tool.py:15) — headless, tanpa ekstensi, dan
# karena itu tidak bisa dipakai untuk airdrop yang butuh wallet.
#
# Sebagai gantinya kita menyalakan Chrome for Testing sendiri (agentdrop
# browser) lalu menyuruh Hermes ATTACH ke sana lewat cdp_url:
#
#   tools/browser_tool.py:2431-2435
#       if cdp_override and not force_local:
#           session_info = _create_cdp_session(task_id, cdp_override)
#   tools/browser_tool.py:2909
#       backend_args = ["--cdp", session_info["cdp_url"]]
#   komentarnya: "The rest of the command (--json, command, args) is identical."
#
# Jadi seluruh tool native (browser_navigate, browser_snapshot, browser_click,
# ...) dan protokol ref accessibility-tree tetap berfungsi persis sama.
#
# HARUS Chrome for Testing, BUKAN Google Chrome branded: sejak Chrome 137
# build branded mengabaikan --load-extension.
#
# JANGAN set BROWSER_CDP_URL bersama --session: agent-browser >=0.13 membuat
# browser lokal sendiri dan mengabaikan --cdp tanpa error apa pun.
browser:
  # Kosong = built-in browser tools. Jangan diisi "browser-use".
  backend: ""

  # ATTACH ke Chrome yang sudah jalan, bukan meluncurkan browser sendiri.
  # Harus loopback: CDP adalah remote control penuh atas browser, dan browser
  # ini memegang wallet.
  cdp_url: "http://127.0.0.1:9222"

  # Sesi ditutup otomatis setelah idle selama ini (detik). Default Hermes 120
  # (2 menit) terlalu pendek untuk farming: sesi login dashboard bisa tertutup
  # di tengah rangkaian aksi.
  inactivity_timeout: 1800
  command_timeout: 30
  # Karakter snapshot maksimum sebelum di-truncate-and-store. Naikkan untuk
  # halaman dashboard airdrop yang panjang.
  snapshot_threshold: 15000
  record_sessions: true
  # FALSE: agent tidak boleh diarahkan ke localhost.
  allow_private_urls: false

  # Tidak berlaku di mode CDP (hanya dipakai mode lokal Hermes). GUI di setup
  # ini datang dari noVNC yang dijalankan `agentdrop browser`.
  headed: false

  # Dialog/modal. must_respond = agent wajib menjawab dialog; auto-dismiss
  # setelah dialog_timeout_s.
  dialog_policy: "must_respond"
  dialog_timeout_s: 300

# ----------------------------------------------------------------------------
# TERMINAL
# ----------------------------------------------------------------------------
terminal:
  backend: "local"
  cwd: "."
  timeout: 180
  # "profile" = paksa HERMES_HOME/home untuk isolasi config CLI per profil.
  # Relevan karena repo ini memakai 5 profil worker.
  home_mode: "profile"
  # SECURITY: off by default. Jangan aktifkan kecuali Anda paham implikasinya.
  docker_mount_cwd_to_workspace: false

# ----------------------------------------------------------------------------
# COMPRESSION
# ----------------------------------------------------------------------------
compression:
  enabled: true

# ----------------------------------------------------------------------------
# GATEWAY — satu proses melayani semua profil
# ----------------------------------------------------------------------------
# WAJIB untuk cron. Hermes menyimpan cron job PER-PROFIL
# (cron/jobs.py:68, issue #4707): `hermes --profile worker-daily cron create`
# menulis ke ~/.hermes/profiles/worker-daily/cron/jobs.json.
#
# Tanpa flag ini, ticker gateway hanya membaca HERMES_HOME prosesnya — yaitu
# ~/.hermes/cron/jobs.json, yang kosong. Komentar di gateway/run.py:31774
# menyebut akibatnya persis: "every secondary profile's cron store is silently
# ignored — jobs show as scheduled with a valid next_run_at but never execute
# because no ticker owns that store."
#
# Jadi keempat job dari scripts/install-cron.sh tidak akan pernah jalan tanpa
# ini. Default Hermes adalah false (gateway/config.py:980).
gateway:
  multiplex_profiles: true

# ----------------------------------------------------------------------------
# CRON — scheduler INTERNAL Hermes (ticker in-process 60 detik)
# ----------------------------------------------------------------------------
# JANGAN pakai system crontab untuk ini; Hermes punya scheduler sendiri dan
# job disimpan di tabel SQLite miliknya. Lihat scripts/install-cron.sh.
cron:
  # Validasi config SEBELUM job dijalankan: cek API key resolve, skill siap,
  # platform delivery terpasang. Job gagal dicatat last_status=blocked_config
  # dengan SATU alert, dan tidak ada panggilan LLM. Ini yang Anda inginkan
  # untuk job yang jalan tanpa pengawasan.
  preflight: true

  # Fail-closed kalau model global berubah dari snapshot saat job dibuat.
  # Mencegah job harian diam-diam memakai model mahal.
  model_drift_guard: true

  # Model default untuk semua cron job. Kosong = ikut model.default.
  model: ""
  model_provider: ""

  # JANGAN diaktifkan: membiarkan agent cron membuat job baru bisa memicu
  # scheduling loop tanpa pengawasan.
  allow_agent_scheduling: false

  # "" = ticker in-process bawaan.
  provider: ""

# ----------------------------------------------------------------------------
# TOOL LOOP GUARDRAILS — penting untuk sesi otomatis/tanpa pengawasan
# ----------------------------------------------------------------------------
tool_loop_guardrails:
  warnings_enabled: true
  # Hard stop = circuit breaker. Untuk job cron yang jalan sendiri, berhenti
  # lebih baik daripada menghabiskan seluruh budget iterasi.
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2

# ----------------------------------------------------------------------------
# SECURITY — key asli dari DEFAULT_CONFIG (hermes_cli/config_defaults.py)
# ----------------------------------------------------------------------------
security:
  # Redaksi secret otomatis di log. Default Hermes sudah true; kita tulis
  # eksplisit karena ini guardrail paling penting di repo ini.
  redact_secrets: true

  # Tolak navigasi ke IP privat / loopback dari agent.
  allow_private_urls: false

  # Lindungi file instruksi (AGENTS.md / SOUL.md) dari penimpaan oleh agent.
  protected_instruction_files: true

  # Blocklist domain. DINONAKTIFKAN secara default di sini — kalau Anda ingin
  # agent benar-benar tidak bisa menyentuh UI wallet/exchange, aktifkan dan
  # isi domainnya. Ini cara yang BENAR untuk "burner only", bukan key karangan.
  website_blocklist:
    enabled: false
    domains: []
    #   - metamask.io
    #   - app.uniswap.org
    shared_files: []

  # Izinkan instalasi dependency saat runtime. Matikan kalau Anda mau
  # environment yang benar-benar teraudit / air-gapped.
  allow_lazy_installs: true

# ----------------------------------------------------------------------------
# APPROVALS — mekanisme "butuh persetujuan manusia" yang SEBENARNYA
# ----------------------------------------------------------------------------
# Inilah pengganti yang benar untuk `require_approval_for_wallet`. Hermes tidak
# punya konsep "wallet"; ia punya konsep "tool butuh approval".
approvals:
  # "smart" = kebijakan bawaan Hermes (default).
  mode: "smart"

  # KRITIS untuk repo ini: saat job cron jalan tanpa pengawasan, tidak ada
  # manusia yang bisa menyetujui apa pun. `deny` = tool yang butuh approval
  # langsung DITOLAK, bukan menunggu lalu timeout. Default Hermes 'deny'.
  cron_mode: "deny"

  # Sama untuk pemanggilan sekali jalan (`hermes chat -q ...`) tanpa TTY.
  single_query_mode: "deny"

  # Detik menunggu persetujuan manusia sebelum menyerah.
  timeout: 300

  # Setelah N penolakan berturut-turut, hentikan (circuit breaker).
  denial_breaker_threshold: 3

  # Tolak tool secara eksplisit. Kosongkan bila tidak perlu. Contoh untuk
  # memastikan agent tidak pernah mengeksekusi kode arbitrer saat farming:
  deny: []
  #   - code_execution

  # Konfirmasi untuk slash command destruktif dan reload MCP.
  destructive_slash_confirm: true
  mcp_reload_confirm: true

# ----------------------------------------------------------------------------
# DATABASE
# ----------------------------------------------------------------------------
database:
  # WAL default. Ganti ke "delete" kalau filesystem tidak WAL-crash-safe
  # (mis. bind-mount lewat virtiofs/NFS/SMB).
  journal_mode: "wal"

# ----------------------------------------------------------------------------
# RUNTIME
# ----------------------------------------------------------------------------
runtime:
  nofile_soft_limit: 4096
