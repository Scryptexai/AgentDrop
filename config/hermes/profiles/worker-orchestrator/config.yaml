# ============================================================================
# WORKER: ORCHESTRATOR — pintu masuk Telegram + pendelegasian ke worker
# ============================================================================
# Dipasang ke: ~/.hermes/profiles/worker-orchestrator/config.yaml
# Profil = HERMES_HOME terpisah penuh. Tidak mewarisi config utama.
#
# INI PROFIL YANG MENGHADAP TELEGRAM. Anda mengirim task ke bot, profil ini
# yang menerima, menganalisis, lalu mendelegasikan ke worker di bawahnya.
# ============================================================================

model:
  # Orkestrasi = banyak keputusan routing. Butuh model kuat.
  default: "anthropic/claude-sonnet-4"
  provider: "auto"
  base_url: "https://openrouter.ai/api/v1"

toolsets:
  - hermes-cli
  - browser
  - file
  - web
  - memory
  - todo
  # Dua toolset inilah yang membuat pendelegasian mungkin.
  - delegate_task
  - delegation

# Toolset yang boleh dipakai saat pesan datang dari Telegram.
# Sengaja TIDAK memberi terminal: pintu masuk publik tidak boleh punya shell.
platform_toolsets:
  telegram: [hermes-cli, browser, file, web, memory, todo, delegate_task]

agent:
  # Orkestrator menunggu banyak child selesai. Butuh ruang.
  max_turns: 120
  reasoning_effort: "high"
  # MATIKAN SHELL — lihat penjelasan di akhir file.
  disabled_toolsets: [terminal, code_execution]

# ----------------------------------------------------------------------------
# DELEGATION — inti dari arsitektur berlapis
# ----------------------------------------------------------------------------
# Key asli dari DEFAULT_CONFIG (hermes_cli/config_defaults.py).
delegation:
  # Wajib true agar tool delegate_task aktif untuk profil ini.
  orchestrator_enabled: true

  # Berapa child boleh jalan paralel. 3 cukup untuk farming: lebih dari itu
  # membuat sesi browser bertabrakan dan biaya melonjak.
  max_concurrent_children: 3

  # KEDALAMAN. 1 = orchestrator boleh spawn leaf, leaf TIDAK boleh spawn lagi.
  # JANGAN naikkan kecuali Anda paham implikasinya — delegasi rekursif tanpa batas
  # adalah cara tercepat menghabiskan saldo API.
  max_spawn_depth: 1

  # Child tidak boleh menyetujui aksinya sendiri. Persetujuan tetap milik Anda.
  subagent_auto_approve: false

  # Batas iterasi per child. Default Hermes 250 terlalu longgar untuk satu
  # campaign airdrop.
  max_iterations: 60

  # Ringkasan child yang dikirim balik ke orchestrator.
  max_summary_chars: 24000

  # Model untuk child. Kosong = ikut model orchestrator. Isi dengan model murah
  # kalau child-nya tugas repetitif.
  model: ""
  reasoning_effort: "medium"

browser:
  # 1800 (30 menit), disamakan dengan SESSION_TIMEOUT_MS Camofox.
  inactivity_timeout: 1800
  command_timeout: 30
  snapshot_threshold: 20000
  record_sessions: true
  allow_private_urls: false
  # headed HANYA berlaku untuk browser lokal Hermes (agent-browser), BUKAN
  # Camofox. GUI di setup ini datang dari plugin vnc Camofox
  # (Xvfb 1920x1080 -> x11vnc :5900 -> noVNC :6080). Biarkan false.
  headed: false
  # ------------------------------------------------------------------------
  # CDP: attach ke Chrome for Testing, BUKAN meluncurkan browser sendiri.
  #
  #   tools/browser_tool.py:2431-2435
  #       if cdp_override and not force_local:
  #           session_info = _create_cdp_session(task_id, cdp_override)
  #   tools/browser_tool.py:2909
  #       backend_args = ["--cdp", session_info["cdp_url"]]
  #   komentarnya: "The rest of the command (--json, command, args) is identical."
  #
  # Jadi browser_navigate / browser_snapshot / browser_click dan seluruh
  # protokol ref accessibility-tree tetap berfungsi persis sama.
  #
  # Browser-nya dijalankan scripts/start-browser-cdp.sh: Chrome for Testing +
  # ekstensi wallet + noVNC. HARUS Chrome for Testing — build Chrome branded
  # mengabaikan --load-extension sejak versi 137.
  #
  # JANGAN set BROWSER_CDP_URL ke websocket mentah kalau --session juga aktif:
  # agent-browser >=0.13 membuat browser lokal sendiri dan mengabaikan --cdp
  # tanpa error apa pun.
  #
  # `headed` di atas tidak berlaku di mode CDP — hanya dipakai mode lokal.
  # ------------------------------------------------------------------------
  cdp_url: "http://127.0.0.1:9222"


# Job cron tidak boleh dapat approval (tidak ada manusia di sana).
approvals:
  mode: "smart"
  cron_mode: "deny"
  single_query_mode: "deny"
  denial_breaker_threshold: 3

security:
  redact_secrets: true
  allow_private_urls: false
  protected_instruction_files: true

compression:
  enabled: true

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2

# ---------------------------------------------------------------------------
# MEMORY LOOP
# ---------------------------------------------------------------------------
# Hermes punya tinjauan memory berkala bawaan. `nudge_interval` adalah jumlah
# turn di antaranya. Protokol lengkapnya di skills/self-improvement/SKILL.md:
# baca pelajaran sebelum bertindak, catat kegagalan setelahnya, dan naikkan
# pelajaran yang berulang menjadi pengetahuan skill.
#
# `memory_char_limit` kecil (default 2200 char ~= 800 token) dan SELALU ada di
# konteks, jadi ia untuk fakta frekuensi tinggi. Pengetahuan yang menumpuk
# pergi ke memory/lessons/<profil>.md, yang dibaca saat dibutuhkan.
#
# `write_approval: false` sengaja. Agent yang harus minta izin untuk mencatat
# pelanggarannya sendiri tidak akan mencatat apa pun.
# ---------------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  nudge_interval: 10
  write_approval: false

# ---------------------------------------------------------------------------
# LOG AUDIT
# ---------------------------------------------------------------------------
# Setiap pemanggilan tool dicatat ke ~/.agentdrop/logs/audit-<tanggal>.jsonl.
# Dibaca lewat:  python3 tools/audit.py doctor
#
# Kenapa path-nya ~/.agentdrop dan bukan path repo: Hermes menjalankan command
# hook lewat shlex.split(os.path.expanduser(...)) dengan shell=False
# (hermes-agent/agent/shell_hooks.py:16,555). Jadi `~` di-expand, tetapi $VAR
# TIDAK. scripts/setup.sh menyalin skrip hook ke lokasi tetap ini supaya
# konfigurasi tetap benar di mana pun repo di-clone.
#
# `fail_closed` sengaja TIDAK disetel. Logger yang bisa menggagalkan tool call
# akan dimatikan orang, dan log yang dimatikan tidak berguna sama sekali.
# ---------------------------------------------------------------------------
hooks:
  pre_tool_call:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  post_tool_call:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  subagent_start:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  subagent_stop:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  pre_approval_request:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  post_approval_response:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  on_session_start:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10
  on_session_end:
    - command: "python3 ~/.agentdrop/agent-hooks/audit-log.py"
      timeout: 10

# Cron dan gateway berjalan tanpa TTY, jadi pendaftaran hook baru tidak bisa
# meminta persetujuan interaktif. Tanpa ini hook di atas diabaikan diam-diam
# pada run non-interaktif.
hooks_auto_accept: true

# ============================================================================
# AKSES SHELL DIMATIKAN — INI DISENGAJA, JANGAN NYALAKAN
# ============================================================================
# Toolset `hermes-cli` memuat SELURUH _HERMES_CORE_TOOLS, yang di dalamnya ada:
#     # Terminal + process management
#     "terminal", "process",
# (hermes-agent/toolsets.py:31-35). Jadi meskipun kata "terminal" tidak pernah
# muncul di daftar `toolsets:` di atas, agent TETAP punya tool terminal lewat
# bundle itu.
#
# Akibatnya persis kegagalan yang paling mahal saat agent mengerjakan airdrop:
# alih-alih memanggil tool browser native, agent mengetik perintah shell untuk
# membuka browser sendiri — headless, tanpa ekstensi, tanpa sesi login — lalu
# melaporkan sukses.
#
# `agent.disabled_toolsets` dikurangkan PALING AKHIR dari toolset yang aktif
# (hermes-agent/hermes_cli/tools_config.py:2712-2726, "This runs last so it
# overrides everything above"), jadi ini satu-satunya cara yang benar-benar
# menutup bundle tersebut.
#
#   terminal       -> tool: terminal, process
#   code_execution -> tool: execute_code (menjalankan Python yang memanggil tool)
#
# Browser harus dipanggil lewat tool native (browser_navigate, browser_snapshot,
# browser_click, ...) — bukan lewat shell.
