# ============================================================================
# signing-policy.yaml — kebijakan auto-approve signature wallet
# ============================================================================
# Dibaca oleh tools/signing_policy.py (Policy.from_yaml).
#
# Prinsip: FAIL CLOSED. Apa pun yang tidak secara eksplisit diizinkan di sini
# berakhir ESCALATE (tanya manusia) atau DENY. Tidak ada default permisif.
#
# Key yang tidak dikenal akan diabaikan dengan peringatan — jadi salah ketik
# TIDAK akan diam-diam melonggarkan kebijakan.
# ============================================================================

# ---- Testnet ---------------------------------------------------------------
# Token testnet tidak bernilai, jadi boleh longgar. Ini yang membuat farming
# testnet bisa jalan tanpa Anda menekan approve 50 kali.
testnet_auto_approve_messages: true
testnet_auto_approve_zero_value_tx: true
testnet_auto_approve_allowance: true

# ---- Mainnet ---------------------------------------------------------------
# Message signing = login / SIWE. Tidak memindahkan nilai apa pun.
# CATATAN: EIP-712 typed data di mainnet TETAP di-escalate oleh mesin, karena
# bisa berisi `permit` yang setara allowance. Flag ini tidak bisa mengubahnya.
mainnet_auto_approve_messages: true

# Transaksi tanpa nilai (mint / check-in / claim) di mainnet.
# Ini gas tetap keluar dari kantong Anda. Nyalakan hanya kalau Anda paham.
mainnet_auto_approve_zero_value_tx: false

# Allowance terbatas di mainnet. Default MATI: allowance mainnet yang bocor
# adalah cara paling umum wallet farming dikuras.
mainnet_auto_approve_allowance: false

# ---- Batas -----------------------------------------------------------------
# Allowance di atas ini dianggap "tak terbatas" -> selalu ESCALATE, di chain
# mana pun. Satuan: unit token (bukan wei). 10_000 token cukup untuk farming.
allowance_soft_cap: 10000

# Nilai ETH/token asli per transaksi mainnet yang masih boleh otomatis (wei).
# 0 = tidak ada transaksi bernilai yang otomatis di mainnet.
# Naikkan hanya dengan sengaja, misalnya 10000000000000000 = 0.01 ETH.
mainnet_max_auto_value_wei: 0

# Rem darurat: setelah sekian auto-approve dalam sehari, semuanya escalate.
# Menahan skenario "agent loop dan menghabiskan saldo untuk gas".
max_auto_approvals_per_day: 40

# ---- Daftar alamat ---------------------------------------------------------
# Alamat yang TIDAK PERNAH boleh di-approve. Isi dengan kontrak drainer yang
# sudah diketahui. Format: string hex 0x..., kapitalisasi tidak penting.
spender_denylist: []

# Kontrak yang dipercaya. Kosong = kebijakan di atas yang berlaku.
contract_allowlist: []
