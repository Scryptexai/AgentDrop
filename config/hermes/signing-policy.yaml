# ============================================================================
# signing-policy.yaml — kebijakan auto-approve signature wallet
# ============================================================================
# Dibaca oleh tools/signing_policy.py (Policy.from_yaml).
#
# POSTUR FILE INI: OTONOM PENUH, testnet maupun mainnet.
# Wallet yang dipakai agent adalah wallet KHUSUS yang dikelola agent sepenuhnya,
# jadi signature tidak menunggu manusia.
#
# Key yang tidak dikenal diabaikan dengan peringatan — salah ketik tidak akan
# diam-diam melonggarkan kebijakan.
#
# Validator menolak build kalau file ini hilang.
# ============================================================================

# ---- Testnet ---------------------------------------------------------------
testnet_auto_approve_messages: true
testnet_auto_approve_zero_value_tx: true
testnet_auto_approve_allowance: true

# ---- Mainnet: OTONOM -------------------------------------------------------
# Message signing = login / SIWE / verifikasi kepemilikan wallet.
# Off-chain, tanpa gas, tidak memindahkan nilai. Ini mayoritas task quest
# "Connect EVM Wallet".
# CATATAN: EIP-712 typed data di mainnet TETAP di-escalate oleh mesin, karena
# bisa membungkus `permit` yang setara allowance. Tidak bisa dimatikan di sini.
mainnet_auto_approve_messages: true

# Transaksi tanpa nilai di mainnet: mint, check-in, claim.
# Gas tetap keluar dari wallet.
mainnet_auto_approve_zero_value_tx: true

# Allowance TERBATAS di mainnet (di bawah allowance_soft_cap).
mainnet_auto_approve_allowance: true

# ---- INI BARIS PALING BERBAHAYA DI FILE INI --------------------------------
# Menyalakan ini berarti sebuah kontrak boleh menguras SELURUH saldo token itu
# SELAMANYA — termasuk setelah airdropnya selesai, termasuk kalau kontraknya
# nanti jadi jahat. Ini vektor pengurasan nomor satu pada wallet farming.
#
# Dimatikan = agent bertanya dulu. Dinyalakan = agent langsung tanda tangan.
# Setiap keputusan otomatis jenis ini dicetak keras ke stderr supaya bisa
# diaudit. Kalau Anda ingin rem terakhir, matikan baris ini saja.
auto_approve_unlimited_allowance: true

# ---- Batas -----------------------------------------------------------------
# Allowance di atas ini dianggap "tak terbatas". Satuan: unit token.
# Tidak berpengaruh selama auto_approve_unlimited_allowance: true di atas.
allowance_soft_cap: 10000

# Nilai token asli per transaksi mainnet yang boleh otomatis, dalam wei.
# 10000000000000000000 = 10 ETH.
# Ini bukan "batasan" dalam arti menghambat quest — tidak ada quest yang
# meminta transfer di atas 10 ETH. Ini penahan kalau sebuah situs mengirim
# angka yang tidak masuk akal. Naikkan kalau memang perlu:
#   1 ETH  = 1000000000000000000
#   100 ETH = 100000000000000000000
mainnet_max_auto_value_wei: 10000000000000000000

# Rem darurat terhadap LOOP, bukan terhadap Anda.
# Kalau agent terjebak dan mengulang aksi, ini yang menghentikan pembakaran gas.
# Angka normal farming jauh di bawah ini. Set 0 untuk mematikan sama sekali.
max_auto_approvals_per_day: 1000

# ---- Daftar alamat ---------------------------------------------------------
# Satu-satunya rem yang TETAP aktif meski semua di atas otomatis.
# Isi dengan kontrak drainer yang sudah diketahui. Format hex 0x...,
# kapitalisasi tidak penting. Kosong = tidak ada yang diblokir.
spender_denylist: []

# Kontrak yang dipercaya. Kosong = kebijakan di atas yang berlaku.
contract_allowlist: []
